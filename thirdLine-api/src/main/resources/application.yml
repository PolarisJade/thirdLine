spring:
  application:
    name: thirdLine-api
  profiles:
    active: local   # 切换环境：local / dev
  # 本地密钥来源：Spring Boot 不会自动读取 .env，需显式导入成配置源，
  # 否则 ${AGNES_BASE_URL} 这类占位符解析不到，会原样当成字符串传给下游（URI 解析直接报错）。
  # 工作目录可能是模块目录或仓库根目录，两个路径都导入；optional 保证生产环境没这个文件也能启动。
  # 优先级：系统环境变量 > .env，所以服务器上用环境变量注入即可覆盖。
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]
  # 文件上传大小限制
  servlet:
    multipart:
      max-file-size: 50MB        # 单个文件最大大小
      max-request-size: 100MB    # 单次请求最大大小
  # ============ 邮件 SMTP 配置（请自行填写，QQ/163 等邮箱需开启 SMTP 并使用授权码）============
  mail:
    host: smtp.163.com           # SMTP 服务器地址，如 smtp.qq.com / smtp.163.com
    port: 465                    # 465(SSL) 或 587(STARTTLS)
    username: ${tl.mail.username}  # 发件邮箱账号
    password: ${tl.mail.password}            # 发件邮箱 SMTP 授权码（非登录密码）
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true         # port=465 时开启 SSL；改用 587 时改为 starttls.enable: true

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${tl.db.url}
    username: ${tl.db.username}
    password: ${tl.db.password}
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 600000
      max-lifetime: 1800000
      connection-timeout: 30000
      pool-name: ThirdLineHikariCP

  data:
    redis:
      host: ${tl.redis.host}
      port: 6379
      password: ${tl.redis.password}
      database: ${tl.redis.database}
      timeout: 3000ms

  # ============ Spring AI：OpenAI 兼容协议（当前接 Agnes AI，仅用于页面人物对话）============
  ai:
    openai:
      api-key: ${AGNES_API_KEY}         # 通过环境变量注入；未配置时留空不影响启动
      base-url: ${AGNES_BASE_URL}       # 必须带 /v1：Spring AI 2.0.0 改用官方 OpenAI SDK，会自动拼 /chat/completions
      chat:
        model: agnes-3.0-flash
        max-tokens: 80                  # 限制回复长度：人物只说一句话（约 30 字），同时压低用量
        temperature: 0.9                # 略微提高随机性，同一句话不会每次答得一模一样
    retry:
      max-attempts: 2                   # 偶发 429/5xx 快速重试一次；网络彻底卡死由 tl.chat.timeout-ms 兜底
      backoff:
        initial-interval: 500ms
        multiplier: 2
        max-interval: 2s


server:
  port: 8080

# ============ MyBatis-Plus 公共配置 ============
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true              # 开启下划线转驼峰
    log-impl:    # 打印 SQL
  mapper-locations: classpath*:/mapper/**/*.xml     # Mapper XML 位置
  type-aliases-package: com.god.thirdLine.domain.entity    # 实体类别名包

# ============ JWT 配置 ============
jwt:
  secret: thirdLine-blog-secret-key-please-change-in-production-2026   # 签名密钥，长度不少于 32 字节
  expiration: 86400000         # token 过期时间，单位毫秒（24 小时）
  refresh-threshold: 21600000 # 滑动续期阈值：剩余有效期不足 6 小时时自动签发新 token
  header: Authorization        # 存放 token 的请求头
  token-prefix: "Bearer "      # token 前缀
  refresh-header: X-Refresh-Token  # 续期后新 token 的响应头名称

# ============ 对象存储选择（local / dev 可覆盖）============
tl:
  oss:
    site: aliyun                     # minio / aliyun，默认沿用阿里云 OSS

  # ============ 页面人物 AI 对话配置（映射 ChatProperties）============
  chat:
    timeout-ms: 30000                # 超过这个时间没返回就换成兜底台词（免费额度偶发长时间无响应）
    max-input-length: 200            # 单条输入最大字符数，超出返回 CHAT_MESSAGE_TOO_LONG
    max-concurrent: 4                # 对话并发上限，同时也是对 Agnes 的并发上限，避免触发 RPM 限流
    sensitive-reply: "唔……这个我不想聊，我们说点别的吧？"
    fallback-replies:                # 超时 / 报错 / 空回复时随机返回一条
      - "唔……我刚刚走神了，再说一遍好不好？"
      - "唔唔？（歪着头看你）"
      - "唔……好像没听清呢，你再说一次？"

# ============ MinIO 配置占位（启用后请自行填写）============
minio:
  endpoint: ${tl.oss.minio.endpoint}      # S3 API 地址，如 http://127.0.0.1:9000（不是控制台端口）
  access-key: ${tl.oss.minio.access-key}
  secret-key: ${tl.oss.minio.secret-key}
  bucket-name: ${tl.oss.minio.bucket-name} # 请先创建存储桶，并设置公开读取或配置可访问的代理
  url-prefix: ${tl.oss.minio.url-prefix}     # 可选，包含桶路径的访问前缀；留空使用 endpoint/bucket-name
  dir: blog                          # 上传目录前缀

# ============ 阿里云 OSS 配置（请自行填写）============
aliyun:
  oss:
    endpoint: https://oss-cn-wuhan-lr.aliyuncs.com             # 地域节点 Endpoint
    access-key-id: LTAI5t8dFKjYfFDV5tXHmnEZ                       # 访问密钥 ID
    access-key-secret: ${ALI_ACE_KEY_SECRET}                      # 访问密钥 Secret
    bucket-name: third-line                                       # 存储空间名称
    url-prefix:                                                   # 访问域名前缀，留空则使用 https://{bucket}.{endpoint}；绑定自定义域名时填写
    dir: blog                                                     # 上传文件的目录前缀

# ============ 注册邮箱验证码配置 ============
email-code:
  subject: 【thirdLine】邮箱验证码   # 验证码邮件主题
  expire-minutes: 5               # 验证码有效期（分钟）
  send-interval-seconds: 60        # 同一邮箱两次发送的最小间隔（秒）
